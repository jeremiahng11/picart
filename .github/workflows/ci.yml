name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Test
      run: npm run react-test -- --watchAll=false
      env:
        CI: true

    - name: Build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build

    - name: Archive artifacts Mac
      if: startsWith(matrix.os, 'macos')
      uses: actions/upload-artifact@v4
      with:
        name: jkl-cartridge-app-macos-${{ github.sha }}
        path: |
          dist/*.dmg

    - name: Archive artifacts Windows
      if: startsWith(matrix.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: jkl-cartridge-app-windows-${{ github.sha }}
        path: |
          dist/*.exe

    - name: Archive artifacts Linux
      if: startsWith(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v4
      with:
        name: jkl-cartridge-app-linux-${{ github.sha }}
        path: |
          dist/*.AppImage

    - name: Archive artifacts Web
      if: startsWith(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v4
      with:
        name: jkl-cartridge-webapp-${{ github.sha }}
        path: |
          build/**
