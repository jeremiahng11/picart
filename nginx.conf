server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # CRA emits content-hashed filenames under /static, so these are safe to
    # cache indefinitely. Set in one header rather than via `expires`, which
    # would emit a second, separate Cache-Control.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets in the site root keep a fixed filename across deploys, so they must
    # revalidate or a CDN will serve them stale. Hashed assets under /static do
    # not have this problem.
    location ~ ^/(favicon\.png|apple-touch-icon\.png|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # The app has no client-side router, so there is nothing to fall back to.
    # Serving index.html for unknown paths would return 200 text/html for a
    # missing asset and hide the 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
